# hive config: ${XDG_CONFIG_HOME:-~/.config}/hive/config.toml
# A named profile (`hive --profile NAME`, or HIVE_PROFILE=NAME) reads .../hive/profiles/NAME/config.toml
# and has its own lock, queen dir and systemd unit hive-NAME.service; its defaults are prefix = NAME,
# session = "NAME-agents", tmux_socket = "hive-NAME", and it refuses the default profile's socket.
# Unknown keys are errors.

# prefix = "myhost"              # machine part of instance and window names; default: short hostname
# session = "myhost-agents"      # default: "<prefix>-agents"
# tmux_socket = "hive"           # tmux -L name; default "hive"; use another for test/isolated configs
# prefix and session: no ".", ":" or whitespace.
# Paths (search_roots, agent dir, ...): absolute or start with ~.
# login_shell = true             # default true: panes run "<shell> -l" so the login profile applies
# shell = "/bin/bash"            # default: login shell from passwd, else $SHELL, else /bin/sh
# search_roots = ["~/work", "~/notes"]   # where `hive spawn NAME` looks for a directory NAME; `hive dirs` lists them, `hive roots add PATH` adds one
# inspect_roots = ["~/.local/bin", "/usr/local/bin", "/usr/bin", "/bin", "/opt"]   # the default; the only dirs `hive inspect-launcher` reads from

[defaults]
# Placeholders: {name} = "<type>-<machine>-<index>" (machine = prefix), {type}, {index}, {dir}, {prefix}, {args},
# {session_id} (fresh UUID per pane launch; without it the driver appends its session flag, for claude `--session-id <uuid>`)
command = "claude -n {name} --remote-control {name} --permission-mode auto --session-id {session_id}"
# launcher = "claude"            # default launcher for new types; a [[launchers]] name or a discover name
# system = "claude"              # agent system that runs the commands: "claude" or "codex" (docs/systems/). Also settable
#   per [[launchers]], per [[agents]] and in [queen]; precedence: agent > launcher > defaults > claude.
# args = ["--fable"]            # extra launcher flags: list of non-empty strings, each shell-quoted (placeholders expanded first).
#   Placed at {args} in the command, else appended at the end. A per-type or [queen] args replaces this list, no merge.
#   A launcher that takes flags before "--" needs {args}: command = "claude-supervisor run api {args} -- -n {name} --remote-control {name}"

# [queen]                        # optional; the queen starts in <config dir>/queen unless disabled
# enabled = true                 # default true; false: no queen pane (a running one is stopped), e.g. for a test hive
# The queen's command always gets `--tools Bash,Monitor,Read,Grep,Glob,Edit,Write,NotebookEdit,AskUserQuestion --strict-mcp-config`
# appended (unless its command or args already have --tools / --strict-mcp-config), so it has no WebFetch, Agent or MCP tools.
# system = "claude"             # default: [defaults] system; the queen's system must be able to run a queen
# command = "claude -n {name} --remote-control {name} --permission-mode auto --session-id {session_id}"   # default: [defaults] command
# args = ["--fable"]             # default: [defaults] args
# discover = "claude-supervisor list"   # `hive discover` runs this and prints its output; `hive spawn --sandbox NAME` reads it:
#   one record per line, key=value tokens, spaces double-quoted; required keys name, config_dir, command, e.g.
#   name=api config_dir=~/.claude-api command="claude-supervisor run api {args} -- -n {name} --remote-control {name}"
#   optional key args="--fable" (shell-quoted string, split like a shell would)
# config_dir = "~/.claude-queen" # Claude config dir of the queen's command; only used to find the trust file, never exported
# env = { FOO = "bar" }          # per-type env, exported after [env]; not set on the tmux server

[env]                            # optional, exported in every pane before the command
# SSH_AUTH_SOCK = "$XDG_RUNTIME_DIR/ssh-agent.socket"

[service]                        # optional, extra units for After= in hive.service
# after = ["ssh-agent.service"]

# Launchers: named commands that new types can use, e.g. a sandboxed claude. `hive launchers` lists them.
# [[launchers]]
# name = "claude"                  # required, unique, [a-z0-9][a-z0-9-]*
# system = "claude"               # optional; default: [defaults] system; COMMAND is checked by that system's driver
# command = "claude -n {name} --remote-control {name} --permission-mode auto --session-id {session_id}"   # required; must contain {name} and --remote-control
# config_dir = "~/.claude"         # optional: Claude config dir of this launcher (trust file location); never exported
# description = "plain claude"     # optional

# Agents: one tmux window per type, one pane per instance. None are configured, so
# `hive up` starts only the queen. Add them with `hive spawn DIR` (or ask the queen),
# or uncomment and edit the entry below; `dir` must exist.
# Workspace trust: hive never seeds Claude Code's folder trust silently. `hive spawn` exits 3 for an untrusted
# directory until you rerun it with --trust; `hive up` / `hive reconcile` warn `hive: warning: untrusted <name> <root>; attach and accept Claude's trust prompt, or run 'hive spawn --trust' after the user confirms` on stderr.
# A command without --remote-control, or whose program is not on PATH, only gets a warning when its pane starts.

# [[agents]]
# type = "project"                 # required, unique; window "<type>-<machine>"
# dir = "~/work/my-project"        # must exist
# count = 1                        # panes; default 1; 0 keeps the entry without panes
# indices = [2, 3]                 # instead of count: explicit instance numbers (written by `hive stop --index`); exclusive with count
# system = "claude"                # optional; default: [defaults] system (`hive spawn --launcher` writes the launcher's); no command = that system's default command
#   A Codex worker: system = "codex" without command runs "codex {args} -a never -s workspace-write" in ~/.codex; pair the
#   machine once (codex remote-control start, then codex remote-control pair) and leave config_dir unset (docs/systems/codex.md).
# command = "claude -n {name} --remote-control {name}"   # optional per-type override of defaults.command
# config_dir = "~/.claude-sandbox"   # optional: Claude config dir of this type's command; only used to find the trust file <config_dir>/.claude.json, never exported
# args = ["--fable"]                 # optional per-type args; replaces defaults.args (also: hive spawn --arg=--fable)
# env = { FOO = "bar" }              # optional per-type env (also: hive spawn --env KEY=VALUE); CLAUDE_CONFIG_DIR is rejected, use config_dir
