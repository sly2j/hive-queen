[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-queen"
dynamic = ["version"]
description = "Run N instances of each agent kind in tmux panes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/sly2j/hive-queen"

[project.scripts]
hive = "hive.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["hive", "hive.drivers"]

[tool.setuptools.package-data]
hive = ["config.example.toml", "queen/*", "queen/claude/*", "queen/claude/hooks/*", "queen/codex/*", "queen/codex/hooks/*", "hooks/*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
